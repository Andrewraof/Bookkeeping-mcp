[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-bookkeeping-mcp"
version = "0.1.0"
description = "MCP server exposing full-control Odoo bookkeeping and BOQ/Budget tools to Claude, ChatGPT, or any MCP client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Pinned below 2.0: mcp 2.0 renamed FastMCP to a different
    # mcp.server.mcpserver.MCPServer API this project does not use.
    "mcp>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
odoo-mcp = "odoo_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
